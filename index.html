<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="전기 자격증 등급별 핵심 스코프 학습 플랫폼">
    <title>전기 자격증 등급별 핵심 스코프 학습 플랫폼</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
    <header class="header" style="text-align: center; padding: 25px 0;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #1e293b;">⚡ 전기 자격증 등급별 핵심 스코프 학습 플랫폼 ⚡</h1>
    </header>

    <main class="main-container" style="max-width: 1400px; margin: 0 auto; padding: 0 20px;">
        <section class="filter-card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; display: flex; gap: 20px; justify-content: center;">
            <div class="control-box" style="display: flex; flex-direction: column; gap: 5px; width: 250px;">
                <label style="font-size: 0.85rem; font-weight: 700; color: #64748b;">목표 자격증 선택</label>
                <select id="gradeSelect" class="modern-select" style="padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 500;">
                    <option value="engineer">전기기사</option>
                    <option value="industrial">전기산업기사</option>
                    <option value="craftsman">전기기능사</option>
                </select>
            </div>
            <div class="control-box" style="display: flex; flex-direction: column; gap: 5px; width: 250px;">
                <label style="font-size: 0.85rem; font-weight: 700; color: #64748b;">학습 검토 모드</label>
                <select id="viewFilter" class="modern-select" style="padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 500;">
                    <option value="written">필기 모드 (Written)</option>
                    <option value="practical">실기 모드 (Practical)</option>
                    <option value="mockexam">⚡ 실전 모의고사</option>
                </select>
            </div>
        </section>

        <div class="content-layout" style="display: flex; gap: 25px; align-items: flex-start;">
            
            <aside class="sidebar-layout" id="sidebarArea" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px;">
                <div class="card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                    <h3 style="font-size: 1rem; font-weight: 700; color: #1e293b; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 15px;"><i class="fas fa-book"></i> 소속 과목 카테고리</h3>
                    <div id="categoryTabs" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </div>
                
                <div class="card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                    <h3 id="reqTitle" style="font-size: 1rem; font-weight: 700; color: #1e293b; border-bottom: 2px solid #ea580c; padding-bottom: 10px; margin-bottom: 15px;">🏅 자격 요건 스코프</h3>
                    <div id="requirementsBox" style="font-size: 0.9rem; color: #475569; line-height: 1.6;"></div>
                </div>
            </aside>

            <section class="main-content-view" style="flex-grow: 1; min-width: 0;">
                <div id="conceptsGrid" class="concepts-grid" style="display: grid; grid-template-columns: 1fr; gap: 20px;"></div>
                
                <div id="mockExamContainer" style="display: none; background: white; padding: 35px; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);"></div>
            </section>

        </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
